<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مركز أكتوبر للتكييف — 70 Logo Concepts (AC Elements)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0F172A;color:#E2E8F0;font-family:'Cairo','Tajawal','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif;min-height:100vh}
header{text-align:center;padding:48px 20px 24px}
header h1{font-size:clamp(24px,4vw,40px);font-weight:700;color:#F8FAFC;letter-spacing:0}
header p{margin-top:10px;color:#94A3B8;font-size:15px}
header .pillars{margin-top:14px;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center}
header .pillars span{border:1px solid #B08D57;color:#D9B87A;border-radius:999px;padding:4px 16px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;max-width:1700px;margin:0 auto;padding:24px 28px 64px}
@media(max-width:1400px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr;padding:16px}}
.card{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:16px;cursor:zoom-in;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;gap:12px}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#B08D57;box-shadow:0 14px 34px rgba(0,0,0,.4);outline:none}
.meta{display:flex;align-items:flex-start;gap:12px;min-height:58px}
.num{flex:0 0 auto;min-width:44px;height:44px;border-radius:12px;background:#B08D57;color:#0F172A;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;direction:ltr}
.txt h2{font-size:14px;color:#F8FAFC;font-weight:700}
.txt p{font-size:13.5px;line-height:1.7;color:#CBD5E1}
.art svg{width:100%;height:auto;display:block;border-radius:12px}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.96);z-index:100;display:none;flex-direction:column}
#modal.open{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:#0B1220;border-bottom:1px solid #334155;flex-wrap:wrap}
.bar .cap{color:#E2E8F0;font-size:15px;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
.btns button{background:#1E293B;color:#F8FAFC;border:1px solid #475569;border-radius:10px;padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
.btns button:hover{background:#334155;border-color:#B08D57}
.btns button.close{background:#7F1D1D;border-color:#B91C1C}
.btns button.close:hover{background:#B91C1C}
#viewport{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;user-select:none}
#viewport.drag{cursor:grabbing}
#stage{width:min(78vh,92vw);transform-origin:center center;will-change:transform}
#stage svg{width:100%;height:auto;display:block;border-radius:16px;pointer-events:none}
.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;color:#64748B;pointer-events:none;direction:ltr}
#zl{color:#94A3B8;font-size:13px;min-width:52px;text-align:center;align-self:center}
</style>
</head>
<body>
<header>
  <h1>مركز أكتوبر للتكييف — 70 مقترح شعار بعناصر التكييف</h1>
  <p>Comprehensive AC services · Maintenance · Installation · System Setup · Sales</p>
  <div class="pillars"><span>الفخامة</span><span>الاستدامة</span><span>الأمان</span></div>
</header>
<main class="grid" id="grid"></main>

<div id="modal" role="dialog" aria-modal="true">
  <div class="bar">
    <div class="cap" id="cap"></div>
    <div class="btns">
      <button id="zin">Zoom In (+)</button>
      <button id="zout">Zoom Out (-)</button>
      <button id="zreset">Reset Zoom</button>
      <span id="zl">100%</span>
      <button class="close" id="zclose">Close (X)</button>
    </div>
  </div>
  <div id="viewport"><div id="stage"></div><div class="hint">Mouse wheel = zoom · Drag = pan · Esc = close</div></div>
</div>

<script>
/* ---------- Brand ---------- */
const B={ar:'مركز أكتوبر للتكييف',en:'OCTOBER',sub:'AIR CONDITIONING'};

/* ---------- Basic helpers ---------- */
const f1=x=>Number(x).toFixed(1);
const S=(k,w)=>`fill="none" stroke="${k}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const Q=(n,r,st=-90,cx=100,cy=100)=>Array.from({length:n},(_,i)=>{const t=(st+i*360/n)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]});
const P=(...a)=>Q(...a).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const rep=(n,f,step)=>Array.from({length:n},(_,i)=>f(i,i*(step||360/n))).join('');
const G=(a,s,cx=100,cy=100)=>`<g transform="rotate(${a} ${cx} ${cy})">${s}</g>`;
const SHIELD='M100 18L168 42V104C168 144 136 168 100 184C64 168 32 144 32 104V42Z';
const DROP='M0 -26C0 -26 -20 2 -20 12A20 20 0 0 0 20 12C20 2 0 -26 0 -26Z';

/* ---------- AC element helpers ---------- */
// Snowflake (6 arms with branches)
const sn=(cx,cy,r,col,w=4)=>`<g transform="translate(${cx} ${cy})" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${rep(6,(i,ang)=>`<g transform="rotate(${ang})"><path d="M0 0V${f1(-r)}M0 ${f1(-r*.55)}L${f1(-r*.2)} ${f1(-r*.75)}M0 ${f1(-r*.55)}L${f1(r*.2)} ${f1(-r*.75)}"/></g>`)}</g>`;
// Wall-mounted split AC unit: body b, accent a, slot colour c
const ac=(x,y,w,h,b,a,c)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${f1(h*.28)}" fill="${b}"/><path d="M${f1(x+w*.08)} ${f1(y+h*.62)}H${f1(x+w*.92)}" stroke="${c}" stroke-width="${f1(Math.max(1.5,h*.07))}" stroke-linecap="round"/><rect x="${f1(x+w*.1)}" y="${f1(y+h*.72)}" width="${f1(w*.8)}" height="${f1(h*.1)}" rx="${f1(h*.05)}" fill="${a}"/><circle cx="${f1(x+w*.84)}" cy="${f1(y+h*.3)}" r="${f1(Math.max(1.6,h*.06))}" fill="${a}"/>`;
// Airflow wave
const wv=(x,y,w,col,sw=4,n=2,amp=8)=>{const p=w/n;let d=`M${x} ${y}q${f1(p/4)} ${-amp} ${f1(p/2)} 0`;for(let i=1;i<2*n;i++)d+=`t${f1(p/2)} 0`;return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`};
// Fan with n blades and hub
const fan=(cx,cy,r,n,col,hub)=>`<g transform="translate(${f1(cx)} ${f1(cy)}) scale(${(r/66).toFixed(3)})">${rep(n,(i,ang)=>`<g transform="rotate(${ang})"><path d="M0 0C0 -38 18 -66 50 -58C52 -26 32 -2 0 0Z" fill="${col}"/></g>`)}<circle r="9" fill="${hub}"/></g>`;
// Outdoor condenser unit
const out=(x,y,w,h,k,a,c)=>{const cx=x+w*.4,cy=y+h/2,r=Math.min(w,h)*.36;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${f1(h*.1)}" ${S(k,5)}/><circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(r)}" ${S(k,4)}/>${fan(cx,cy,r*.85,3,a,k)}${[.78,.86,.94].map(t=>`<path d="M${f1(x+w*t)} ${f1(y+h*.2)}V${f1(y+h*.8)}" ${S(k,3)}/>`).join('')}`};
// Arc path
const arc=(cx,cy,r,a1,a2)=>{const p=t=>[cx+r*Math.cos(t*Math.PI/180),cy+r*Math.sin(t*Math.PI/180)];const s=p(a1),e=p(a2);return `M${f1(s[0])} ${f1(s[1])}A${r} ${r} 0 0 1 ${f1(e[0])} ${f1(e[1])}`};

/* ---------- 70 Logo Concepts: [Arabic concept, mark(k=ink, a=accent, c=background)] ---------- */
const L=[
/*1*/["مثمّن أضلاع يرمز لـ«أكتوبر» (Octo = 8) يحتضن وحدة تكييف سبليت وندفة ثلج.",
 (k,a,c)=>`<polygon points="${P(8,82,-67.5)}" ${S(k,5)}/>${ac(56,72,88,36,k,a,c)}${sn(100,138,20,a,4)}`],
/*2*/["ندفة ثلج كبيرة تحتضن في قلبها وحدة تكييف: التبريد في مركز العلامة.",
 (k,a,c)=>`${sn(100,100,84,k,4)}<circle cx="100" cy="100" r="38" fill="${c}"/>${ac(72,90,56,22,k,a,c)}`],
/*3*/["درع هندسي بداخله وحدة تكييف وموجات هواء: الأمان والانتعاش في علامة واحدة.",
 (k,a,c)=>`<path d="${SHIELD}" ${S(k,5)}/>${ac(62,62,76,34,k,a,c)}${wv(64,124,72,a,5,2)}${wv(72,148,56,a,5,2)}`],
/*4*/["حرف O تخترقه وحدة تكييف: دائرة أكتوبر التي يعبرها الهواء البارد.",
 (k,a,c)=>`<circle cx="100" cy="100" r="60" ${S(k,9)}/><rect x="38" y="80" width="124" height="42" rx="12" fill="${c}"/>${ac(44,86,112,30,k,a,c)}`],
/*5*/["حرف الألف (أ) بهيئة وحدة تكييف عمودية (Tower) يتوجها ماسة.",
 (k,a,c)=>`<rect x="82" y="46" width="36" height="128" rx="8" fill="${k}"/>${[70,92,114,136].map(y=>`<path d="M90 ${y}H110" ${S(c,4)}/>`).join('')}<circle cx="100" cy="158" r="5" fill="${a}"/><polygon points="100,10 114,26 100,42 86,26" fill="${a}"/>`],
/*6*/["مروحة وحدة التكييف بأربع شفرات داخل شبكة حماية دائرية.",
 (k,a,c)=>`<circle cx="100" cy="100" r="88" ${S(a,2.5)}/><circle cx="100" cy="100" r="74" ${S(k,3)}/>${fan(100,100,66,4,k,a)}`],
/*7*/["ندفة ثلج منحوتة بالمساحة السلبية داخل قرص صلب.",
 (k,a,c)=>`<circle cx="100" cy="100" r="82" fill="${k}"/>${sn(100,100,52,c,5)}<circle cx="100" cy="100" r="92" ${S(a,2)}/>`],
/*8*/["قوس إسلامي مدبب يحتضن وحدة تكييف وموجات هواء: عمارة عريقة وبرودة عصرية.",
 (k,a,c)=>`<path d="M40 176V96C40 56 78 32 100 16C122 32 160 56 160 96V176" ${S(k,5)}/>${ac(66,72,68,32,k,a,c)}${wv(70,130,60,a,5,2)}<path d="M28 176H172" ${S(k,5)}/>`],
/*9*/["زهرة لوتس مصرية تحمل ندفة ثلج في قلبها: نقاء الهواء وجذور الهوية.",
 (k,a,c)=>{const pet='<path d="M100 40C125 75 125 120 100 152C75 120 75 75 100 40Z"/>';return `<g fill="none" stroke="${k}" stroke-width="4">${G(-62,pet,100,152)}${G(62,pet,100,152)}</g><g fill="${a}" stroke="${c}" stroke-width="3">${G(-32,pet,100,152)}${G(32,pet,100,152)}</g><g fill="${k}" stroke="${c}" stroke-width="3">${pet}</g>${sn(100,110,17,c,3.5)}<path d="M54 164Q100 184 146 164" ${S(k,4)}/>`}],
/*10*/["شمس ساطعة تحتها وحدة تكييف ونسيم بارد: حرارة تُروَّض.",
 (k,a,c)=>`<circle cx="100" cy="50" r="30" fill="${a}"/>${ac(48,92,104,42,k,a,c)}${wv(60,160,80,k,5,2)}`],
/*11*/["هرم صلب بندفة ثلج سلبية في قلبه: ثبات وبرودة وخبرة.",
 (k,a,c)=>`<polygon points="100,26 174,170 26,170" fill="${k}"/>${sn(100,126,32,c,4.5)}<rect x="26" y="180" width="148" height="5" fill="${a}"/>`],
/*12*/["مكعب سداسي: وجهه العلوي ندفة ثلج والجانبي شرائح تهوية.",
 (k,a,c)=>`<polygon points="${P(6,80)}" ${S(k,5)}/><path d="M100 100L31 60M100 100L169 60M100 100V180" ${S(k,4)}/>${sn(100,60,20,a,3.5)}${[93,113,133].map(y=>`<path d="M43 ${y}L88 ${y+26}" ${S(a,4)}/>`).join('')}`],
/*13*/["وحدة تكييف علوية تنساب منها أقواس هواء متتالية.",
 (k,a,c)=>`${ac(24,22,80,30,k,a,c)}${[36,64,92].map((r,i)=>`<path d="${arc(44,56,r,5,85)}" ${S(i==1?a:k,6)}/>`).join('')}`],
/*14*/["نجمة ثمانية من مربعين متقاطعين (المشربية والرقم 8) تحيط بندفة ثلج.",
 (k,a,c)=>`<rect x="40" y="40" width="120" height="120" ${S(k,5)}/>${G(45,`<rect x="40" y="40" width="120" height="120" ${S(a,5)}/>`)}<circle cx="100" cy="100" r="32" fill="${c}"/>${sn(100,100,24,k,4)}`],
/*15*/["تاج فوق وحدة تكييف: رمز الفخامة في خدمة التبريد.",
 (k,a,c)=>`<path d="M60 96L66 52L86 74L100 42L114 74L134 52L140 96Z" fill="${a}"/>${ac(40,110,120,50,k,a,c)}${wv(56,180,88,a,4,2)}`],
/*16*/["معيّنات متداخلة تتقلص نحو ندفة ثلج: تركيز وإتقان.",
 (k,a,c)=>`<polygon points="${P(4,84)}" ${S(k,5)}/><polygon points="${P(4,60)}" ${S(a,4)}/>${sn(100,100,30,k,4)}`],
/*17*/["ورقة شجر بشرائح أفقية كفتحات التكييف وندفة ثلج: الطبيعة والتقنية معاً.",
 (k,a,c)=>`<path d="M100 20C158 62 158 132 100 182C42 132 42 62 100 20Z" fill="${k}"/><path d="M30 92H170M30 116H170M30 140H170" ${S(c,5)}/>${sn(100,62,15,c,3)}`],
/*18*/["دائرة نصفها كتلة حرارية ونصفها ندفة ثلج: الحرارة والبرودة.",
 (k,a,c)=>`<path d="M100 20A80 80 0 0 0 100 180Z" fill="${k}"/><path d="M100 20A80 80 0 0 1 100 180Z" ${S(k,5)}/>${sn(140,100,32,a,4)}`],
/*19*/["الرقم 10 (أكتوبر): الصفر مروحة تكييف دوّارة.",
 (k,a,c)=>`<polygon points="82,44 82,156 64,156 64,70 44,82 44,60" fill="${k}"/><circle cx="132" cy="100" r="46" ${S(k,5)}/>${fan(132,100,40,4,a,k)}`],
/*20*/["قطرة ماء تحمل ندفة ثلج سلبية: تبريد مستدام وترشيد.",
 (k,a,c)=>`<path d="M100 20C100 20 46 88 46 126A54 54 0 0 0 154 126C154 88 100 20 100 20Z" fill="${k}"/>${sn(100,128,28,c,4)}`],
/*21*/["وحدة تكييف خارجية (كمبريسور) بمروحة ثلاثية وشبكة جانبية.",
 (k,a,c)=>`${out(30,44,140,112,k,a,c)}<path d="M40 176H160" ${S(a,5)}/>`],
/*22*/["حلزون هواء ينساب نحو ندفة ثلج في المركز.",
 (k,a,c)=>{let d='';for(let t=0;t<=12.4;t+=.25){const r=4+t*6;d+=(t?'L':'M')+f1(100+r*Math.cos(t))+' '+f1(100+r*Math.sin(t))}return `<path d="${d}" ${S(k,5)}/><circle cx="100" cy="100" r="17" fill="${c}"/>${sn(100,100,13,a,3)}`}],
/*23*/["أشجار صنوبر من مثلثات مكدسة تحت ندفة ثلج: هواء منعش وبيئة نظيفة.",
 (k,a,c)=>`<g fill="${k}" stroke="${c}" stroke-width="3" stroke-linejoin="round"><polygon points="100,90 166,168 34,168"/><polygon points="100,52 152,124 48,124"/><polygon points="100,20 140,78 60,78"/></g><rect x="92" y="170" width="16" height="16" fill="${a}"/>${sn(158,32,16,a,3.5)}`],
/*24*/["حرف O بطراز كلاسيكي (ديدون) في قلبه ندفة ثلج ذهبية.",
 (k,a,c)=>`<ellipse cx="100" cy="100" rx="58" ry="72" fill="${k}"/><ellipse cx="100" cy="100" rx="30" ry="54" fill="${c}"/>${sn(100,100,24,a,3.5)}`],
/*25*/["حلقة مفتوحة تتنفس وفي قلبها مروحة تكييف.",
 (k,a,c)=>`<circle cx="100" cy="100" r="80" fill="none" stroke="${k}" stroke-width="10" stroke-dasharray="400 100" stroke-linecap="round"/>${fan(100,100,56,3,k,a)}`],
/*26*/["ثلاث شيفرونات كطبقات جبال تعلوها ندفة ثلج: ارتفاع واستدامة.",
 (k,a,c)=>`<g transform="translate(0 14)"><g ${S(k,9)}><path d="M36 92L100 38L164 92"/><path d="M36 128L100 74L164 128"/></g><path d="M36 164L100 110L164 164" ${S(a,9)}/></g>${sn(100,26,15,a,3.5)}`],
/*27*/["حرف A (Air) عارضته وحدة تكييف: الهواء في قلب الحرف.",
 (k,a,c)=>`<path d="M38 172L100 28L162 172" ${S(k,9)}/><rect x="58" y="104" width="84" height="46" fill="${c}"/>${ac(66,112,68,30,k,a,c)}`],
/*28*/["نجمة سداسية من مثلثين متعاكسين تحيط بمروحة: توازن الحرارة والبرودة.",
 (k,a,c)=>`<polygon points="${P(3,82)}" ${S(k,5)}/><polygon points="${P(3,82,90)}" ${S(k,5)}/>${fan(100,100,30,3,a,k)}`],
/*29*/["إكليل غار حول وحدة تكييف: تكريم للجودة والإتقان.",
 (k,a,c)=>{const lf=`<path d="M62 152C34 124 34 76 62 48" ${S(k,4)}/><g fill="${a}">${[[44,132,-20],[37,108,-6],[37,84,6],[44,60,20]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="6" ry="13" transform="rotate(${r} ${x} ${y})"/>`).join('')}</g>`;return `${lf}<g transform="translate(200 0) scale(-1 1)">${lf}</g>${ac(74,86,52,28,k,a,c)}`}],
/*30*/["درع صلب بندفة ثلج سلبية: أمان التبريد وضمان الخدمة.",
 (k,a,c)=>`<path d="${SHIELD}" fill="${k}"/>${sn(100,104,42,c,5)}`],
/*31*/["موزّع هواء دائري بشرائح رأسية: فتحة التكييف بصيغة شعار.",
 (k,a,c)=>`<circle cx="100" cy="100" r="82" fill="${k}"/>${[0,1,2,3,4,5,6].map(i=>{const x=52+i*16,h=Math.sqrt(82*82-(x-100)**2)-16;return `<path d="M${x} ${f1(100-h)}V${f1(100+h)}" ${S(i==3?a:c,4)}/>`}).join('')}`],
/*32*/["سهمان هابطان وندفة ثلج داخل دائرة: تدفق الهواء البارد.",
 (k,a,c)=>`<circle cx="100" cy="100" r="80" ${S(k,5)}/><path d="M64 88L100 120L136 88M64 118L100 150L136 118" ${S(a,8)}/>${sn(100,54,12,k,3)}`],
/*33*/["كرة أرضية بندفة ثلج داخل حلقتين: تبريد بمسؤولية بيئية عالمية.",
 (k,a,c)=>`<circle cx="100" cy="100" r="88" ${S(k,3)}/><circle cx="100" cy="100" r="74" ${S(k,5)}/>${sn(100,100,52,a,4.5)}`],
/*34*/["برعم بورقتين متناظرتين وندفة ثلج: نمو ونظافة واستدامة.",
 (k,a,c)=>`<path d="M100 170C60 160 40 120 45 70C90 80 105 120 100 170Z" fill="${k}"/><path d="M100 170C140 160 160 120 155 70C110 80 95 120 100 170Z" fill="${a}"/>${sn(100,118,20,c,3.5)}<path d="M100 170V192" ${S(k,5)}/>`],
/*35*/["هلال بأسلوب سلبي وندفة ثلج كنجمة: ليالي أكتوبر المعتدلة.",
 (k,a,c)=>`<circle cx="100" cy="100" r="72" fill="${k}"/><circle cx="126" cy="88" r="60" fill="${c}"/>${sn(150,72,18,a,3.5)}`],
/*36*/["وريقة رباعية من أربع دوائر تحيط بندفة ثلج.",
 (k,a,c)=>`${[[100,66],[134,100],[100,134],[66,100]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="34" ${S(k,5)}/>`).join('')}${sn(100,100,22,a,4)}`],
/*37*/["دائرة بداخلها وحدة تكييف وموجتا نسيم: هواء لطيف.",
 (k,a,c)=>`<circle cx="100" cy="100" r="82" ${S(k,5)}/>${ac(58,56,84,38,k,a,c)}${wv(60,124,80,a,5,2)}${wv(68,148,64,a,5,2)}`],
/*38*/["جوهرة سداسية الأوجه بندفة ثلج في قلبها: فخامة البرودة.",

/* ---------- Colour schemes: [ink, accent, background] ---------- */
const SCH=[["#14213D","#B08D57","#F6F2EA"],["#F6F2EA","#C9A66B","#14213D"],["#1F4D45","#B08D57","#F3EFE6"],["#0B0B0B","#8A6A3B","#EFEAE0"],["#F3EFE6","#7FB5A6","#1F4D45"]];
const AR="font-family=\"'Cairo','Tajawal','Segoe UI',Tahoma,'Noto Naskh Arabic',sans-serif\"";
const LA="font-family=\"'Helvetica Neue',Helvetica,Arial,sans-serif\"";

function build(i){
  const [k,a,c]=SCH[i%5];
  const mark=L[i][1](k,a,c);
  const st=i%3;let t='';
  if(st==0){
    t=`<text x="150" y="262" text-anchor="middle" ${AR} font-size="25" font-weight="700" fill="${k}">${B.ar}</text><text x="150" y="288" text-anchor="middle" ${LA} font-size="10" letter-spacing="5" fill="${a}">${B.en} ${B.sub}</text>`;
  }else if(st==1){
    t=`<text x="150" y="258" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" letter-spacing="8" fill="${k}">${B.en}</text><rect x="130" y="270" width="40" height="2" fill="${a}"/><text x="150" y="294" text-anchor="middle" ${AR} font-size="17" font-weight="600" fill="${a}">${B.ar}</text>`;
  }else{
    t=`<text x="150" y="266" text-anchor="middle" ${AR} font-size="27" font-weight="700" fill="${k}">${B.ar}</text><rect x="135" y="278" width="30" height="2" fill="${a}"/><text x="150" y="300" text-anchor="middle" ${LA} font-size="9" letter-spacing="4" fill="${a}">${B.sub}</text>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 310" role="img" aria-label="Logo ${i+1}"><rect width="300" height="310" rx="14" fill="${c}"/><g transform="translate(50,22)">${mark}</g>${t}</svg>`;
}

/* ---------- Render grid ---------- */
const svgs=L.map((_,i)=>build(i));
const grid=document.getElementById('grid');
grid.innerHTML=L.map((l,i)=>`<article class="card" tabindex="0" data-i="${i}"><div class="meta"><div class="num">${i+1}</div><div class="txt"><h2>الشعار رقم ${i+1}</h2><p>${l[0]}</p></div></div><div class="art">${svgs[i]}</div></article>`).join('');

/* ---------- Modal with zoom / pan ---------- */
const modal=document.getElementById('modal'),stage=document.getElementById('stage'),vp=document.getElementById('viewport'),cap=document.getElementById('cap'),zl=document.getElementById('zl');
let s=1,x=0,y=0,drag=null;
const apply=()=>{stage.style.transform=`translate(${x}px,${y}px) scale(${s})`;zl.textContent=Math.round(s*100)+'%'};
const reset=()=>{s=1;x=0;y=0;apply()};
function zoomAt(f,px=0,py=0){const ns=Math.min(12,Math.max(.3,s*f)),r=ns/s;x=px-(px-x)*r;y=py-(py-y)*r;s=ns;apply()}
function openModal(i){stage.innerHTML=svgs[i];cap.textContent='الشعار رقم '+(i+1)+' — '+L[i][0];reset();modal.classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('open');stage.innerHTML='';document.body.style.overflow=''}
grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openModal(+c.dataset.i)});
grid.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const c=e.target.closest('.card');if(c){e.preventDefault();openModal(+c.dataset.i)}}});
document.getElementById('zin').onclick=()=>zoomAt(1.25);
document.getElementById('zout').onclick=()=>zoomAt(1/1.25);
document.getElementById('zreset').onclick=reset;
document.getElementById('zclose').onclick=closeModal;
vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))},{passive:false});
vp.addEventListener('pointerdown',e=>{drag={px:e.clientX,py:e.clientY,x,y};vp.classList.add('drag');vp.setPointerCapture(e.pointerId)});
vp.addEventListener('pointermove',e=>{if(!drag)return;x=drag.x+(e.clientX-drag.px);y=drag.y+(e.clientY-drag.py);apply()});
const endDrag=()=>{drag=null;vp.classList.remove('drag')};
vp.addEventListener('pointerup',endDrag);vp.addEventListener('pointercancel',endDrag);
vp.addEventListener('dblclick',reset);
document.addEventListener('keydown',e=>{
  if(!modal.classList.contains('open'))return;
  if(e.key==='Escape')closeModal();
  else if(e.key==='+'||e.key==='=')zoomAt(1.25);
  else if(e.key==='-'||e.key==='_')zoomAt(1/1.25);
  else if(e.key==='0')reset();
});
</script>
